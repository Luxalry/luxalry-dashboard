<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Portal | Tadrib.ma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" href="/assets/images/favicon_io/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Cairo', 'system-ui', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                        'tech': ['Inter', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            gold: '#F59E0B',
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155'
                        }
                    },
                    backgroundImage: {
                        'blueprint': "linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px)"
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-repeat: no-repeat, repeat, repeat;
        }

        /* Technical Corners */
        .tech-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #F59E0B;
            opacity: 0.7;
        }

        .tl {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .tr {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }

        .bl {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        .br {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        /* Scan Line Animation */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(245, 158, 11, 0.2);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Status Dot Pulse */
        .status-dot {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
        }
    </style>
</head>

<body class="bg-[#0f172a] overflow-hidden">

    <!-- Layout Wrapper (Forces LTR & Dynamic Height) -->
    <div id="app-layout" dir="ltr"
        class="relative min-h-[100dvh] w-full flex items-center justify-center overflow-hidden">

        <!-- Ambient Glow -->
        <div class="hidden">
        </div>

        <!-- Scattered Watermarks -->
        <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div class="absolute top-10 left-10 text-slate-800/50 text-4xl font-black font-sans opacity-20">PORTAL</div>
            <div class="absolute bottom-20 right-10 text-slate-800/50 text-6xl font-black font-sans opacity-20">TADRIB
            </div>
            <div class="absolute top-1/3 right-20 text-slate-800/30 text-2xl font-mono rotate-90 opacity-20">ACCESS
            </div>
            <div class="absolute bottom-1/3 left-20 text-slate-800/30 text-2xl font-mono -rotate-45 opacity-20">v3.0
            </div>
        </div>

        <!-- Main Monolith Card -->
        <div class="relative w-[92%] max-w-[450px] bg-brand-panel shadow-2xl z-10 mx-auto group">
            <!-- Dynamic Glow (Attached to Card) -->
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] bg-blue-900/30 blur-[80px] -z-10 rounded-full pointer-events-none">
            </div>

            <!-- Top Accent Bar -->
            <div class="h-1 w-full bg-brand-gold shadow-[0_0_15px_rgba(245,158,11,0.3)]"></div>

            <!-- Scan Line -->
            <div class="scan-line"></div>

            <!-- Card Content -->
            <div class="p-6 md:p-12 relative text-center">
                <!-- Tech Corners -->
                <div class="tech-corner tl"></div>
                <div class="tech-corner tr"></div>
                <div class="tech-corner bl"></div>
                <div class="tech-corner br"></div>

                <!-- Logo/Icon -->
                <div
                    class="inline-flex items-center justify-center w-20 h-20 bg-brand-dark border border-brand-border rounded-lg mb-8">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-brand-gold" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                </div>

                <!-- Titles -->
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-2 tracking-wide font-sans">TADRIB.MA</h1>
                <p class="text-sm font-mono text-slate-400 uppercase tracking-widest mb-10">System Portal Access</p>

                <!-- Status Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10 text-left">
                    <div class="bg-brand-dark p-3 border border-brand-border">
                        <div class="text-[10px] font-mono text-slate-500 uppercase mb-1">Database</div>
                        <div class="flex items-center gap-2 text-xs font-mono text-emerald-400">
                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 status-dot"></div>
                            CONNECTED
                        </div>
                    </div>
                    <div class="bg-brand-dark p-3 border border-brand-border">
                        <div class="text-[10px] font-mono text-slate-500 uppercase mb-1">Security</div>
                        <div class="flex items-center gap-2 text-xs font-mono text-emerald-400">
                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 status-dot"></div>
                            ACTIVE
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <a href="/admin"
                    class="block w-full bg-brand-gold hover:bg-amber-500 text-brand-dark font-bold py-4 px-6 transition-all duration-200 uppercase tracking-wider text-sm flex items-center justify-center gap-3 group active:translate-y-0.5">
                    <span>Enter System</span>
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </a>

                <!-- Footer -->
                <div class="mt-8 pt-6 border-t border-brand-border text-[10px] font-mono text-slate-500 uppercase">
                    Restricted Area • Authorized Personnel Only
                </div>
            </div>
        </div>

        <!-- Background Watermark -->
        <div class="hidden">
            PORTAL
        </div>

    </div>

</body>

</html>
