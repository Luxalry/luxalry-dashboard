<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error | Tadrib.ma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" href="/assets/images/favicon_io/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Cairo', 'system-ui', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                        'tech': ['Inter', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            gold: '#F59E0B',
                            red: '#EF4444',
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155'
                        }
                    },
                    backgroundImage: {
                        'blueprint': "linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px)"
                    },
                    animation: {
                        'glitch': 'glitch 1s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-repeat: no-repeat, repeat, repeat;
        }

        /* Technical Corners (Red for Error) */
        .tech-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #EF4444;
            opacity: 0.7;
        }

        .tl {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .tr {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }

        .bl {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        .br {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        /* Scan Line Animation (Red) */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-[#0f172a] overflow-hidden">

    <!-- Layout Wrapper (Forces LTR & Dynamic Height) -->
    <div id="app-layout" dir="ltr"
        class="relative min-h-[100dvh] w-full flex items-center justify-center overflow-hidden">

        <!-- Ambient Glow (Red) -->
        <div class="hidden">
        </div>

        <!-- Scattered Watermarks -->
        <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div class="absolute top-10 left-10 text-slate-800/50 text-4xl font-black font-sans opacity-20">ERROR</div>
            <div class="absolute bottom-20 right-10 text-slate-800/50 text-6xl font-black font-sans opacity-20">404
            </div>
            <div class="absolute top-1/3 right-20 text-slate-800/30 text-2xl font-mono rotate-90 opacity-20">MISSING
            </div>
            <div class="absolute bottom-1/3 left-20 text-slate-800/30 text-2xl font-mono -rotate-45 opacity-20">LOST
            </div>
        </div>

        <!-- Main Monolith Card -->
        <div class="relative w-[92%] max-w-[450px] bg-brand-panel shadow-2xl z-10 mx-auto group">
            <!-- Dynamic Glow (Attached to Card) -->
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] bg-red-900/30 blur-[80px] -z-10 rounded-full pointer-events-none">
            </div>

            <!-- Top Accent Bar (Red) -->
            <div class="h-1 w-full bg-brand-red shadow-[0_0_15px_rgba(239,68,68,0.3)]"></div>

            <!-- Scan Line -->
            <div class="scan-line"></div>

            <!-- Card Content -->
            <div class="p-6 md:p-12 relative text-center">
                <!-- Tech Corners -->
                <div class="tech-corner tl"></div>
                <div class="tech-corner tr"></div>
                <div class="tech-corner bl"></div>
                <div class="tech-corner br"></div>

                <!-- Error Icon -->
                <div
                    class="inline-flex items-center justify-center w-20 h-20 bg-brand-dark border border-red-900/50 rounded-lg mb-8 animate-pulse">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-brand-red" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>

                <!-- Titles -->
                <h1 class="text-4xl md:text-6xl font-black text-white mb-2 tracking-tighter font-mono animate-glitch">
                    404
                </h1>
                <p class="text-xs md:text-sm font-mono text-brand-red uppercase tracking-widest mb-8">Coordinates Not
                    Found
                </p>

                <p class="text-slate-400 text-sm leading-relaxed mb-10">
                    The requested system resource could not be located. The path may be corrupted or the file has been
                    moved
                    to a secure archive.
                </p>

                <!-- Action Button -->
                <a href="/admin/dashboard"
                    class="block w-full bg-brand-dark border border-brand-border hover:border-brand-gold hover:text-brand-gold text-slate-300 font-bold py-4 px-6 transition-all duration-200 uppercase tracking-wider text-sm flex items-center justify-center gap-3 group">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span>Return to Base</span>
                </a>

                <!-- Footer -->
                <div class="mt-8 pt-6 border-t border-brand-border text-[10px] font-mono text-slate-500 uppercase">
                    Error Code: 0x404_MISSING
                </div>
            </div>
        </div>

        <!-- Background Watermark -->
        <div class="hidden">
            ERROR
        </div>

    </div>

</body>

</html>
